[project]
name = "cxr-server"
version = "0.1.0"
description = "FastAPI inference service (ONNX Runtime, no torch)"
requires-python = ">=3.11"
dependencies = [
  "cxr-common",
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "structlog==26.1.0",
  "slowapi==0.1.10",
  "onnxruntime==1.31.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# GPU image: install with `--extra gpu --no-install-package onnxruntime` (see docker/server.gpu.Dockerfile)
gpu = ["onnxruntime-gpu==1.31.1"]
